<main>

<section class="section">
 <div class="container">
  <div class="form-card">
   <h2>Student Feedback</h2>
   <p class="note">Your feedback helps us improve our classes and support.</p>
   <form action="#" method="post">
    <div class="form-group"><label for="name">Name</label><input id="name" name="name" type="text" required></div>
    <div class="form-group"><label for="rating">Rating</label>
     <select id="rating" name="rating"><option>Excellent</option><option>Good</option><option>Average</option><option>Needs Improvement</option></select>
    </div>
    <div class="form-group"><label for="feedback">Your Feedback</label><textarea id="feedback" name="feedback" required></textarea></div>
    <button class="btn" type="submit">Send Feedback</button>
   </form>
  </div>
 </div>
</section>

</main>

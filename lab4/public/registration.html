<main>

<section class="section">
 <div class="container">
  <div class="form-card">
   <h2>Student Registration</h2>
   <p class="note">Fill in your details to request admission information.</p>
   <form action="#" method="post">
    <div class="form-group"><label for="name">Full Name</label><input id="name" name="name" type="text" required></div>
    <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="form-group"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" required></div>
    <div class="form-group"><label for="course">Select Course</label>
     <select id="course" name="course"><option>Class 9-10</option><option>Class 11-12</option><option>Competitive Exams</option></select>
    </div>
    <div class="form-group"><label for="message">Additional Information</label><textarea id="message" name="message"></textarea></div>
    <button class="btn" type="submit">Submit Registration</button>
   </form>
  </div>
 </div>
</section>

</main>
